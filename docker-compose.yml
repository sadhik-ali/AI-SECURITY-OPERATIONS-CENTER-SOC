# AI SOC - full stack for demonstrations and integrated mode.
#   docker compose --profile search --profile ai up --build
# Omit the profiles for the minimum stack (database + API + UI).
# Values come from .env in this directory; copy .env.example first.

name: ai-soc

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aisoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ai_soc}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aisoc} -d ${POSTGRES_DB:-ai_soc}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.11.1
    profiles: ["search"]
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_PASSWORD:-ChangeMeStrong%231}
      PLUGINS_SECURITY_DISABLED: "false"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sfk -u admin:${OPENSEARCH_PASSWORD} https://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aisoc}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_soc}
      OLLAMA_BASE_URL: http://ollama:11434
      OPENSEARCH_URL: https://opensearch:9200
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./sample_logs:/sample_logs:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_DATA_SOURCE: ${VITE_DATA_SOURCE:-api}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_WS_URL: ${VITE_WS_URL:-/ws/alerts}
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
  opensearch-data:
  ollama-models:
