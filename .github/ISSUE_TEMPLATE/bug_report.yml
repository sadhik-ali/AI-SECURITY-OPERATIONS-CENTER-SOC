name: "🐞 Bug report"
description: Report something that does not behave as documented.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file this. AI SOC is a security tool, so
        please include the environment details — a bug that only reproduces on
        PostgreSQL or in `integrated` mode is still a bug.

        **Never paste real credentials, tokens, or production log lines.**
        Redact them first; the app itself redacts secrets in its own audit trail.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      placeholder: A clear, concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
      placeholder: The documented behaviour you were looking for.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1. `uvicorn app.main:app --port 8000`
        2. Sign in as `analyst@aisoc.dev`
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - frontend (UI)
        - backend (API)
        - auth / RBAC
        - database / migrations
        - detection rules
        - WebSocket / live alerts
        - AI assistant
        - Docker / compose
        - docs
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      value: |
        - Commit / release: 
        - OS: 
        - Python: 
        - Node: 
        - `MODE` (`demo` / `integrated`): 
        - Database (SQLite / PostgreSQL): 
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Copy the JSON log lines, browser console output, or pytest failure. Redact anything sensitive.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I reproduced this on the latest `master`.
          required: true
        - label: I ran `pytest` (backend) or `npm run typecheck` (frontend) to confirm this is not a local environment issue.
          required: true
        - label: I removed all secrets, tokens and real telemetry from the report.
          required: true
